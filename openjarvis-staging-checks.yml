name: WORTHSY OpenJarvis staging checks

on:
  push:
    branches: ["staging/openjarvis-integration"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  staging-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install API dependencies
        run: python -m pip install -r personalization_api/requirements.txt
      - name: Check customer assistant JavaScript
        run: node --check worthsy-openjarvis.js
      - name: Check gateway and existing API tests
        run: python -m unittest discover -s tests -v
      - name: Confirm every customer page loads the isolated assistant assets
        run: |
          python - <<'PY'
          from pathlib import Path
          pages = ["index.html", "shop.html", "about.html", "blog.html", "career.html", "brand.html", "sneakerhead.html"]
          for page in pages:
              text = Path(page).read_text(encoding="utf-8")
              assert "worthsy-openjarvis.css" in text, page
              assert "worthsy-openjarvis-config.js" in text, page
              assert "worthsy-openjarvis.js" in text, page
          print("All customer pages reference the isolated OpenJarvis UI assets.")
          PY
