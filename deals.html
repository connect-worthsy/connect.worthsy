<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deals | WORTHSY</title><link rel="stylesheet" href="worthsy-universal-nav.css?v=32"><style>body{font-family:Inter,Arial,sans-serif;color:#111;background:#fafafa;margin:0;padding:25px}main{max-width:1200px;margin:30px auto}h1{font-size:clamp(28px,5vw,44px);letter-spacing:-1px}p{color:#666}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.tools input,.tools select{padding:12px;border:1px solid #ddd;border-radius:10px;background:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{border:1px solid #e5e5e5;border-radius:16px;background:#fff;padding:14px}.card img{width:100%;height:180px;object-fit:contain}.card h3{font-size:15px}.card button,.btn{padding:10px 13px;border:1px solid #111;border-radius:10px;background:#111;color:white;cursor:pointer;margin:4px 3px 0 0}.card button.secondary,.secondary{background:white;color:#111}.price{font-weight:800}.note{font-size:12px;color:#777}.empty{padding:24px;border:1px dashed #bbb;border-radius:14px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;background:white}th,td{padding:12px;border:1px solid #ddd;text-align:left;min-width:140px}th{background:#f4f4f4}a{color:inherit}@media(max-width:600px){body{padding:12px}}</style></head><body><main><h1>Deals & product picks</h1><p>WORTHSY product discovery tools. Retailer prices, specifications and availability can change; verify details on the retailer page.</p><div id="app">Loading catalogue…</div></main><script src="worthsy-universal-nav.js"></script><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let P=[];fetch('products.json').then(r=>r.json()).then(d=>{P=Array.isArray(d)?d:[];render()}).catch(()=>document.querySelector('#app').innerHTML='<p>Catalogue could not be loaded. Please refresh.</p>');const key='worthsy-comparison-selection';function chosen(){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch{return []}}function saveChoice(ids){localStorage.setItem(key,JSON.stringify(ids))}function price(p){return p.price||'Not listed'}function card(p,i){return '<article class="card">'+(p.images?.[0]?'<img loading="lazy" src="'+esc(p.images[0])+'" alt="">':'')+'<h3>'+esc(p.name)+'</h3><p>'+esc(p.brand||p.merchant||p.platform||'')+' · '+esc(p.category||'')+'</p><p class="price">'+esc(price(p))+'</p><p class="note">'+esc(p.description||'')+'</p><button onclick="selectProduct('+i+')">Add to comparison</button>'+(p.link?'<a class="btn secondary" target="_blank" rel="noopener sponsored" href="'+esc(p.link)+'">Retailer ↗</a>':'')+'</article>'}function selectProduct(i){let ids=chosen();if(!ids.includes(i)){if(ids.length>=4){alert('Compare up to four products at a time. Remove one on the Comparison page.');return}ids.push(i)}saveChoice(ids);alert('Added. Open Comparisons from the sidebar.')}function render(){let q='',cat='';document.querySelector('#app').innerHTML='<div class="tools"><input id="q" placeholder="Search products…"><select id="cat"><option value="">All categories</option>'+[...new Set(P.map(p=>p.category).filter(Boolean))].map(c=>'<option>'+esc(c)+'</option>').join('')+'</select></div><p class="note">Curated catalogue picks — discounts are not independently verified or dynamically tracked.</p><div id="list" class="grid"></div>';const update=()=>{q=document.querySelector('#q').value.toLowerCase();cat=document.querySelector('#cat').value;let a=P.filter(p=>(!q||[p.name,p.brand,p.category,p.description].join(' ').toLowerCase().includes(q))&&(!cat||p.category===cat));document.querySelector('#list').innerHTML=a.map((p,i)=>card(p,P.indexOf(p))).join('')||'<div class="empty">No products match.</div>'};document.querySelector('#q').oninput=update;document.querySelector('#cat').onchange=update;update()}</script></body></html>
