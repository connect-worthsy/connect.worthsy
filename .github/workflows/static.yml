# Deploy static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare WORTHSY Amazon storefront and affiliate links
        run: |
          python - <<'PY'
          import json, os, pathlib, re
          # Amazon Associates tracking tag supplied by the site owner.
          tag = "worthsy01-21"
          pathlib.Path("amazon-config.js").write_text(
              "window.WORTHSY_AMAZON_TAG = " + json.dumps(tag) + ";" + chr(10),
              encoding="utf-8"
          )
          products_path = pathlib.Path("products.json")
          if products_path.exists():
              products = json.loads(products_path.read_text(encoding="utf-8"))
              for product in products:
                  if str(product.get("platform", "")).lower() != "amazon":
                      continue
                  link = str(product.get("link", ""))
                  if not re.match(r"^https://www\.amazon\.in/dp/", link, flags=re.I):
                      continue
                  link = re.sub(r"[?&]tag=[^&]+", "", link)
                  link = link.rstrip("?&")
                  if tag:
                      link += ("&" if "?" in link else "?") + "tag=" + tag
                  product["link"] = link
              products_path.write_text(json.dumps(products, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
          # Do not inject a floating "Shop Amazon Finds" button into the main site.
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
