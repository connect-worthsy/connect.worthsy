# Deploy static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare WORTHSY Amazon storefront
        env:
          AMAZON_ASSOCIATE_TAG: ${{ secrets.AMAZON_ASSOCIATE_TAG }}
        run: |
          python - <<'PY'
          import json, os, pathlib, re
          tag = os.environ.get("AMAZON_ASSOCIATE_TAG", "").strip()
          pathlib.Path("amazon-config.js").write_text(
              "window.WORTHSY_AMAZON_TAG = " + json.dumps(tag) + ";\\n",
              encoding="utf-8"
          )
          path = pathlib.Path("index.html")
          html = path.read_text(encoding="utf-8")
          link = '<a href="./amazon.html" aria-label="Shop Amazon finds" style="position:fixed;right:18px;bottom:18px;z-index:99999;padding:12px 16px;border-radius:999px;background:#d8b77a;color:#17130d;font:700 13px/1.2 system-ui,sans-serif;text-decoration:none;box-shadow:0 8px 28px #0008">Shop Amazon Finds ↗</a>'
          if "./amazon.html" not in html:
              match = list(re.finditer(r"</body\\s*>", html, flags=re.I))
              if match:
                  m = match[-1]
                  html = html[:m.start()] + link + html[m.start():]
              else:
                  html += link
              path.write_text(html, encoding="utf-8")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
