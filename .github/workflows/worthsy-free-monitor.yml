name: WORTHSY free daily health and catalogue checks

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches: ["main", "automation/free-ops"]
    paths:
      - "scripts/monitor_site.py"
      - "scripts/audit_catalogue.py"
      - "scripts/validate_catalogue.py"
      - "scripts/validate_motion.py"
      - ".github/workflows/worthsy-free-monitor.yml"

permissions:
  contents: read

concurrency:
  group: worthsy-free-monitor
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out WORTHSY
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Audit product catalogue without modifying it
        run: python scripts/audit_catalogue.py
      - name: Validate storefront pages and shared elements
        run: python scripts/validate_catalogue.py
      - name: Validate motion assets
        run: python scripts/validate_motion.py
      - name: Check JavaScript syntax
        run: |
          node --check worthsy-search.js
          node --check worthsy-universal-nav.js
          node --check worthsy-motion.js
          node --check worthsy-personalization.js
          node --check worthsy-openjarvis.js
          node --check worthsy-public-upgrades.js
      - name: Check live website and Python gateway
        run: python scripts/monitor_site.py
